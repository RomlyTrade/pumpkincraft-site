<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OceanWorld2</title>
<meta name="description" content="OceanWorld2 Minecraft server. Java: oceanworld2.com, Bedrock: play.oceanworld2.com port 19132.">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4f8ff;
    --muted: #b9cdf2;
    --panel: rgba(6, 18, 52, 0.72);
    --edge: #7fdcff;
    --shadow: #020818;
    --discord: #5865f2;
    --reddit: #ff4500;
    --map: #3fbf5f;
    --list: #e8b630;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: #0b2a6b;
    color: var(--ink);
    font-family: 'VT323', monospace;
    font-size: 22px;
    overflow-x: hidden;
  }
  #water {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    image-rendering: pixelated; z-index: 0;
  }
  .shade {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(2,8,24,0.55) 100%);
  }
  main {
    position: relative; z-index: 2;
    max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px;
    display: flex; flex-direction: column; align-items: center; gap: 34px;
  }

  /* IP */
  .ip {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    text-align: center;
  }
  .logo { margin: 0; line-height: 0; }
  .logo img { width: min(640px, 92vw); height: auto; filter: drop-shadow(4px 4px 0 var(--shadow)); }
  .ip-line {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .ip-label {
    font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--muted);
    text-shadow: 2px 2px 0 var(--shadow); letter-spacing: 1px;
  }
  .ip-btn {
    font-family: 'Press Start 2P', monospace; color: var(--ink);
    background: var(--panel); border: 2px solid var(--edge);
    box-shadow: 3px 3px 0 var(--shadow);
    padding: 7px 10px; cursor: pointer; font-size: clamp(9px, 2.4vw, 12px);
    text-shadow: 2px 2px 0 var(--shadow);
  }
  .ip-btn:hover { background: rgba(20, 50, 120, 0.85); }
  .ip-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
  .copied {
    font-family: 'Press Start 2P', monospace; font-size: 10px; color: #8fffa8;
    height: 12px; text-shadow: 2px 2px 0 var(--shadow);
  }

  /* Islands */
  .islands {
    display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; width: 100%;
  }
  .island {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-decoration: none; color: var(--ink);
    width: min(420px, 44vw); min-width: 240px;
  }
  .island img {
    width: 100%; height: auto; display: block;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,0.45));
    transition: transform .18s ease, filter .18s ease;
  }
  .island:hover img, .island:focus-visible img {
    transform: translateY(-6px) scale(1.03);
    filter: drop-shadow(0 18px 24px rgba(0,0,0,0.5)) brightness(1.06);
  }
  .island span {
    font-family: 'Press Start 2P', monospace; font-size: 14px;
    text-shadow: 3px 3px 0 var(--shadow);
  }

  /* Widgets */
  .widgets {
    width: 100%;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  }
  .widget {
    background: var(--panel); border: 3px solid var(--accent);
    box-shadow: 4px 4px 0 var(--shadow);
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
    color: var(--ink); text-decoration: none; min-height: 150px;
  }
  .widget:hover { background: rgba(20, 50, 120, 0.85); }
  .widget h2 {
    margin: 0; font-family: 'Press Start 2P', monospace; font-size: 12px;
    color: var(--accent); text-shadow: 2px 2px 0 var(--shadow);
  }
  .widget .big { font-size: 30px; line-height: 1; overflow-wrap: anywhere; }
  .widget .sub { color: var(--muted); font-size: 20px; }
  .widget .go { margin-top: auto; font-family: 'Press Start 2P', monospace; font-size: 10px; }
  .dot { display: inline-block; width: 12px; height: 12px; background: #3fdc6a; margin-right: 8px; box-shadow: 0 0 6px #3fdc6a; }
  .dot.off { background: #ff5a5a; box-shadow: 0 0 6px #ff5a5a; }
  .w-discord { --accent: var(--discord); }
  .w-reddit { --accent: var(--reddit); }
  .w-map { --accent: var(--map); }
  .w-lists { --accent: var(--list); }
  .w-lists a {
    color: var(--ink); text-decoration: none; display: block;
    border-bottom: 2px dashed rgba(232, 182, 48, 0.4); padding: 2px 0;
  }
  .w-lists a:hover { color: var(--list); }


  /* Server-wide leaderboards */
  .boards { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .board { background: var(--panel); border: 3px solid var(--list); box-shadow: 4px 4px 0 var(--shadow); padding: 14px 16px; }
  .board h2 { margin: 0 0 8px; font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--list); text-shadow: 2px 2px 0 var(--shadow); }
  .board ol { margin: 0; padding: 0; list-style: none; counter-reset: r; }
  .board li { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; border-bottom: 1px dashed rgba(232,182,48,0.25); counter-increment: r; }
  .board ol li::before { content: counter(r); font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--muted); width: 22px; }
  .board .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .val { color: #ffe9a0; white-space: nowrap; }
  .board .empty { color: var(--muted); }
  .board .online { display: flex; flex-wrap: wrap; gap: 8px; }
  .board .online span { background: rgba(63,191,95,0.18); border: 1px solid #3fbf5f; padding: 0 8px; }
  @media (max-width: 900px) { .boards { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { .widgets { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) {
    .widgets { grid-template-columns: 1fr; }
    .island { width: 100%; }
  }
</style>
</head>
<body>
<canvas id="water" width="16" height="16"></canvas>
<div class="shade"></div>

<main>
  <section class="ip">
    <h1 class="logo"><img src="/assets/ow2-logo.png" alt="OceanWorld2" width="1100" height="261"></h1>
    <div class="ip-line"><span class="ip-label">JAVA:</span> <button class="ip-btn" data-copy="oceanworld2.com">oceanworld2.com</button></div>
    <div class="ip-line"><span class="ip-label">BEDROCK:</span> <button class="ip-btn" data-copy="play.oceanworld2.com">play.oceanworld2.com</button> <span class="ip-label">PORT:</span> <button class="ip-btn" data-copy="19132">19132</button></div>
    <div class="copied" id="copied"></div>
  </section>

  <section class="islands">
    <a class="island" href="/altis">
      <img src="/main-island.png" alt="Altis">
      <span>Altis</span>
    </a>
    <a class="island" href="/stratis">
      <img src="/stratis.png" alt="Stratis">
      <span>Stratis</span>
    </a>
  </section>

  <section class="widgets">
    <a class="widget w-discord" href="https://discord.com/invite/hs8AwWnSQr" target="_blank" rel="noopener">
      <h2>DISCORD</h2>
      <div class="big" id="dc-online">&nbsp;</div>
      <div class="sub" id="dc-members">&nbsp;</div>
      <div class="go">JOIN ▸</div>
    </a>
    <a class="widget w-reddit" href="https://www.reddit.com/r/PumpkinCraft/" target="_blank" rel="noopener">
      <h2>REDDIT</h2>
      <div class="big">r/PumpkinCraft</div>
      <div class="sub" id="rd-members">&nbsp;</div>
      <div class="go">VISIT ▸</div>
    </a>
    <a class="widget w-map" href="https://map.oceanworld2.com/" target="_blank" rel="noopener">
      <h2>LIVE MAP</h2>
      <div class="big" id="sv-status"><span class="dot"></span>…</div>
      <div class="sub" id="sv-players">&nbsp;</div>
      <div class="go">OPEN MAP ▸</div>
    </a>
    <div class="widget w-lists">
      <h2>SERVER LISTS</h2>
      <div id="lists"></div>
    </div>
  </section>

  <section class="boards">
    <div class="board"><h2>MOST HOURS PLAYED</h2><ol id="b-play"><li class="empty">Loading…</li></ol></div>
    <div class="board"><h2>MOST MOBS KILLED</h2><ol id="b-mobs"><li class="empty">Loading…</li></ol></div>
    <div class="board"><h2>ONLINE NOW</h2><div class="online" id="online"><span>…</span></div></div>
  </section>
</main>

<script>
/* ---- Old-school (Alpha/Beta) procedural water ---- */
(function () {
  const S = 16, PX = 5; // texel size on screen
  let cur = new Float32Array(S * S), nxt = new Float32Array(S * S);
  const heat = new Float32Array(S * S), heatA = new Float32Array(S * S);
  const tile = document.createElement('canvas'); tile.width = tile.height = S;
  const tctx = tile.getContext('2d'); const img = tctx.createImageData(S, S);
  const cv = document.getElementById('water'); const ctx = cv.getContext('2d');

  function resize() {
    cv.width = Math.ceil(innerWidth / PX); cv.height = Math.ceil(innerHeight / PX);
    cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  }
  addEventListener('resize', resize); resize();

  function step() {
    for (let x = 0; x < S; x++) for (let y = 0; y < S; y++) {
      let sum = 0;
      for (let dx = x - 1; dx <= x + 1; dx++) sum += cur[(dx & 15) + (y & 15) * S];
      nxt[x + y * S] = sum / 3.3 + heat[x + y * S] * 0.8;
    }
    for (let i = 0; i < S * S; i++) {
      heat[i] += heatA[i] * 0.05;
      if (heat[i] < 0) heat[i] = 0;
      heatA[i] -= 0.1;
      if (Math.random() < 0.05) heatA[i] = 0.5;
    }
    const t = cur; cur = nxt; nxt = t;
    for (let i = 0; i < S * S; i++) {
      let f = cur[i]; if (f > 1) f = 1; if (f < 0) f = 0; f *= f;
      const k = i * 4;
      img.data[k] = 32 + f * 32; img.data[k + 1] = 50 + f * 64; img.data[k + 2] = 255;
      img.data[k + 3] = 146 + f * 50;
    }
    tctx.putImageData(img, 0, 0);
    ctx.fillStyle = '#0b2a6b'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = ctx.createPattern(tile, 'repeat'); ctx.fillRect(0, 0, cv.width, cv.height);
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  for (let i = 0; i < 40; i++) step();
  if (!reduce) setInterval(step, 50); // 20 ticks a second, like the game
})();

/* ---- Copy IP ---- */
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
  const msg = document.getElementById('copied');
  try { await navigator.clipboard.writeText(b.dataset.copy); msg.textContent = 'COPIED!'; }
  catch (e) { msg.textContent = b.dataset.copy; }
  clearTimeout(window.__ct); window.__ct = setTimeout(() => msg.textContent = '', 1800);
}));

/* ---- Server lists ---- */
const SERVER_LISTS = [
  // ['Planet Minecraft', 'https://www.planetminecraft.com/server/...'],
];
(function () {
  const box = document.getElementById('lists');
  if (!SERVER_LISTS.length) { box.innerHTML = '<div class="sub">Coming soon</div>'; return; }
  SERVER_LISTS.forEach(([name, url]) => {
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = name + ' ▸'; box.appendChild(a);
  });
})();

/* ---- Live numbers ---- */
const fmt = n => Number(n).toLocaleString('en-GB');
fetch('https://discord.com/api/v9/invites/hs8AwWnSQr?with_counts=true')
  .then(r => r.json()).then(j => {
    if (j.approximate_presence_count == null) return;
    document.getElementById('dc-online').innerHTML = '<span class="dot"></span>' + fmt(j.approximate_presence_count) + ' online';
    document.getElementById('dc-members').textContent = fmt(j.approximate_member_count) + ' members';
  }).catch(() => {});
fetch('https://www.reddit.com/r/PumpkinCraft/about.json')
  .then(r => r.json()).then(j => {
    const n = j && j.data && j.data.subscribers;
    if (n != null) document.getElementById('rd-members').textContent = fmt(n) + ' members';
  }).catch(() => {});
fetch('https://api.mcsrvstat.us/3/oceanworld2.com')
  .then(r => r.json()).then(j => {
    const s = document.getElementById('sv-status'), p = document.getElementById('sv-players');
    if (j.online) {
      s.innerHTML = '<span class="dot"></span>Online';
      p.textContent = j.players.online + ' / ' + j.players.max + ' players';
    } else s.innerHTML = '<span class="dot off"></span>Offline';
  }).catch(() => { document.getElementById('sv-status').textContent = ''; });
/* ---- Server-wide leaderboards ---- */
(function () {
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const board = (id, rows, unit) => {
    const el = document.getElementById(id);
    el.innerHTML = rows && rows.length
      ? rows.map(r => '<li><span class="who">' + esc(r.name) + '</span><span class="val">' + fmt(r.value) + (unit ? ' ' + unit : '') + '</span></li>').join('')
      : '<li class="empty">No entries yet</li>';
  };
  fetch('/data/live.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
    const a = d.altis || {};
    board('b-play', a.playtime, 'h');
    board('b-mobs', a.mobKills, '');
    document.getElementById('online').innerHTML = d.online && d.online.length
      ? d.online.map(n => '<span>' + esc(n) + '</span>').join('')
      : '<span style="border-color:#b9cdf2;background:none">Nobody right now</span>';
  }).catch(() => {
    ['b-play', 'b-mobs'].forEach(id => board(id, []));
    document.getElementById('online').textContent = 'Unavailable';
  });
})();
</script>
</body>
</html>
